 <linearGradient id="fire"><stop stop-color="#ffb02e"/><stop offset=".5" stop-color="#ff6a00"/><stop offset="1" stop-color="#e33b54"/></linearGradient>
 <linearGradient id="blue"><stop stop-color="#37c8ff"/><stop offset="1" stop-color="#8666ff"/></linearGradient>
